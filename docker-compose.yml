services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zermae}
      POSTGRES_USER: ${POSTGRES_USER:-zermae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - zermae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zermae} -d ${POSTGRES_DB:-zermae}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      UPLOAD_DIR: /app/uploads
    volumes:
      - zermae_uploads:/app/uploads
    # Published for host-network nginx (/api → this port)
    ports:
      - "127.0.0.1:5000:5000"

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:-https://zermae.com}
        API_URL: http://api:5000
        API_PREFIX: ${API_PREFIX:-/api/v1}
        HMAC_SIGNING_SECRET: ${HMAC_SIGNING_SECRET}
        SESSION_SECRET: ${SESSION_SECRET}
        SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://zermae.com}
      API_URL: http://api:5000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Published for host-network nginx
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    # Bind 80/443 on the host (same path as before; Hostinger public :443 may still be broken)
    network_mode: host
    volumes:
      - ./deploy/hostinger/nginx.conf:/etc/nginx/nginx.conf:ro
      - zermae_uploads:/srv/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  zermae_pgdata:
  zermae_uploads:
