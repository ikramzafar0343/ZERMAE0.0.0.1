worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	keepalive_timeout 65;
	client_max_body_size 50m;
	server_tokens off;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream zermae_web {
		server 127.0.0.1:3000;
		keepalive 32;
	}

	# HTTP — serves the app (Hostinger public :443 TLS path is currently broken)
	server {
		listen 80;
		listen [::]:80;
		server_name zermae.com www.zermae.com;

		location /uploads/ {
			alias /srv/uploads/;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://zermae_web;
		}
	}

	# HTTPS — Let's Encrypt certs (works on localhost; public :443 needs Hostinger fix)
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		server_name zermae.com www.zermae.com;

		ssl_certificate     /etc/letsencrypt/live/zermae.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/zermae.com/privkey.pem;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;

		location /uploads/ {
			alias /srv/uploads/;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://zermae_web;
		}
	}
}
