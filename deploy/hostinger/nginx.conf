worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	keepalive_timeout 65;
	client_max_body_size 50m;
	server_tokens off;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream zermae_web {
		server 127.0.0.1:3000;
		keepalive 32;
	}

	upstream zermae_api {
		server 127.0.0.1:5000;
		keepalive 32;
	}

	# Shared VPS: Marhas Docker stack is on 127.0.0.1:5080.
	# Zermae nginx uses host network and owns :80/:443, so Marhas must be
	# routed here (host /etc/nginx/sites-enabled/marhas.pk is otherwise unused).
	server {
		listen 80;
		listen [::]:80;
		server_name marhas.pk www.marhas.pk;
		client_max_body_size 12M;

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 120s;
			proxy_send_timeout 120s;
			proxy_pass http://127.0.0.1:5080;
		}
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		server_name marhas.pk www.marhas.pk;
		client_max_body_size 12M;

		ssl_certificate     /etc/letsencrypt/live/marhas.pk/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/marhas.pk/privkey.pem;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_read_timeout 120s;
			proxy_send_timeout 120s;
			proxy_pass http://127.0.0.1:5080;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name zermae.com www.zermae.com;

		location /uploads/ {
			alias /srv/uploads/;
		}

		location /api/ {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://zermae_api;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://zermae_web;
		}
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		http2 on;
		server_name zermae.com www.zermae.com;

		ssl_certificate     /etc/letsencrypt/live/zermae.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/zermae.com/privkey.pem;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;

		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;

		location /uploads/ {
			alias /srv/uploads/;
		}

		location /api/ {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_pass http://zermae_api;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://zermae_web;
		}
	}
}
